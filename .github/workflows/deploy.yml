name: Deploy Portfolio

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString()
            )

            console.log("aud:", payload.aud)
            console.log("sub:", payload.sub)
            console.log("repository:", payload.repository)
            console.log("repository_id:", payload.repository_id)
            console.log("repository_owner:", payload.repository_owner)
            console.log("repository_owner_id:", payload.repository_owner_id)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::970547335998:role/portfolio-github-deploy-role-tf
          aws-region: us-east-1

      - name: Deploy through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0c263c599ad6e0058" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/portfolio/portfolio-cloud-lab",
              "git pull origin main",
              "rsync -av --delete app/ /usr/share/nginx/html/",
              "curl -f http://localhost > /dev/null"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-ids "i-0c263c599ad6e0058"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-ids "i-0c263c599ad6e0058"

            