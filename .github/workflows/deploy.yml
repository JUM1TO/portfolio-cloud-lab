name: Deploy Portfolio

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::970547335998:role/portfolio-github-deploy-role
          aws-region: us-east-1

      - name: Deploy through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0d7b85257f16c2d03" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/portfolio/portfolio-cloud-lab",
              "git pull origin main",
              "rsync -av --delete app/ /usr/share/nginx/html/",
              "curl -f http://localhost > /dev/null"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0d7b85257f16c2d03"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0d7b85257f16c2d03"

            